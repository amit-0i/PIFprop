name: Build and Release Pixel Props

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      devices:
        description: 'Device codenames (space-separated, or "all")'
        required: true
        default: 'kodiak'

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # PREPARE: Determine which devices to build based on input or default list
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set_devices.outputs.devices }}
    steps:
      - name: Determine device list
        id: set_devices
        run: |
          # Pixel 6 and newer (Tensor-era devices with modern partition layout)
          if [ "${{ github.event.inputs.devices }}" = "all" ] || [ -z "${{ github.event.inputs.devices }}" ]; then
            JSON='[
              "oriole", "raven", "bluejay",
              "panther", "cheetah", "lynx",
              "felix", "tangorpro",
              "shiba", "husky", "akita",
              "tokay", "caiman", "komodo", "comet", "tegu",
              "frankel", "blazer", "mustang", "stallion", "rango",
              "cubs", "grizzly", "kodiak", "yogi"
            ]'
          else
            # Convert space-separated input into a JSON array
            JSON=$(echo '${{ github.event.inputs.devices }}' | tr ' ' '\n' | jq -R . | jq -s .)
          fi
          {
            echo "devices<<EOF"
            echo "$JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # BUILD: Download OTA, generate system.prop and a device-specific PIF JSON
  # ------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full e2fsprogs erofs-utils lz4 cpio \
            dos2unix aria2 curl xxd python3 python3-pip jq

      - name: Install Python dependencies
        run: |
          pip3 install payload_dumper
          which payload_dumper || echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download OTA for ${{ matrix.device }}
        run: bash download_latest_ota_build.sh ${{ matrix.device }}

      - name: Extract and build
        run: bash extract_images.sh

      - name: Generate and check PIF JSON
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEVICE_CODENAME: ${{ matrix.device }}
        run: |
          system_prop=$(find extracted_images -type f -name "system.prop" -print -quit 2>/dev/null)
          if [ -z "$system_prop" ]; then
            echo "No system.prop was generated"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p upload
          name=$(python3 - "$system_prop" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          props = {}
          with open(sys.argv[1], encoding="utf-8") as system_prop:
              for line in system_prop:
                  line = line.rstrip("\r\n")
                  if not line or line.lstrip().startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  props[key.strip()] = value

          template = json.loads(Path("pif.json").read_text(encoding="utf-8"))
          pif = {}
          for field, reference in template.items():
              if isinstance(reference, str) and reference.startswith("$"):
                  prop_name = reference[1:]
                  if prop_name not in props:
                      raise SystemExit(
                          f"Missing property {prop_name!r} required for PIF field {field!r}"
                      )
                  pif[field] = props[prop_name]
              else:
                  pif[field] = reference

          build_id = props.get("ro.vendor.build.id", "")
          if not build_id:
              raise SystemExit("Missing ro.vendor.build.id in system.prop")

          codename = re.sub(r"[^A-Za-z0-9._-]+", "_", os.environ["DEVICE_CODENAME"])
          build_id = re.sub(r"[^A-Za-z0-9._-]+", "_", build_id)
          if not codename or not build_id:
              raise SystemExit("Could not form a safe PIF filename")

          name = f"pif-{codename}-{build_id}.json"
          Path("upload", name).write_text(
              json.dumps(pif, indent=4, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(name)
          PY
          )
          echo "Generated: $name"

          # Each device/build has its own release so every release can expose pif.json.
          release_tag="${name%.json}"
          if gh release view "$release_tag" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -qxF "pif.json"; then
            echo "SKIP (already released): $release_tag"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            rm -f "upload/$name"
            exit 0
          fi

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.check.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pif-${{ matrix.device }}
          path: upload/*.json
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pif-*
          merge-multiple: true
          path: new_pifs/
        continue-on-error: true

      # Publish each per-device configuration separately to avoid asset-name collisions.
      - name: Publish PIF JSON files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p new_pifs
          shopt -s nullglob
          pif_files=(new_pifs/*.json)
          if [ "${#pif_files[@]}" -eq 0 ]; then
            echo "No new PIF configurations to release."
            exit 0
          fi

          for source in "${pif_files[@]}"; do
            filename=$(basename "$source")
            TAG="${filename%.json}"
            asset_dir="release_assets/$TAG"
            asset="$asset_dir/pif.json"
            mkdir -p "$asset_dir"
            cp "$source" "$asset"

            model=$(jq -r '.MODEL // "Unknown"' "$source")
            device=$(jq -r '.DEVICE // "Unknown"' "$source")
            android_version=$(jq -r '."VERSION.RELEASE" // "Unknown"' "$source")
            build_id=$(jq -r '.ID // "Unknown"' "$source")
            incremental=$(jq -r '."VERSION.INCREMENTAL" // "Unknown"' "$source")
            security_patch=$(jq -r '.SECURITY_PATCH // "Unknown"' "$source")
            fingerprint=$(jq -r '.FINGERPRINT // "Unknown"' "$source")
            sha256=$(sha256sum "$source" | awk '{print $1}')
            notes="release_assets/$TAG/release-notes.md"

            {
              printf '## %s (%s)\n\n' "$model" "$device"
              printf -- '- **Android version:** %s\n' "$android_version"
              printf -- '- **Build ID:** %s\n' "$build_id"
              printf -- '- **Incremental:** %s\n' "$incremental"
              printf -- '- **Security patch:** %s\n' "$security_patch"
              printf -- '- **Fingerprint:** `%s`\n' "$fingerprint"
              printf -- '- **Download:** `pif.json`\n'
              printf -- '- **SHA-256:** `%s`\n' "$sha256"
            } > "$notes"

            title="$device-$(date +%Y%m%d)"
            if gh release view "$TAG" &>/dev/null; then
              echo "Release $TAG already exists, replacing pif.json..."
              gh release upload "$TAG" "$asset" --clobber
              gh release edit "$TAG" --title "$title" --notes-file "$notes"
            else
              gh release create "$TAG" \
                --title "$title" \
                --notes-file "$notes" \
                "$asset"
            fi
          done
